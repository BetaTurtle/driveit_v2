<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveIt Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        :root {
            /* Fallback variables if not provided by Telegram (e.g. testing in browser) */
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #888888;
            --tg-theme-link-color: #3390ec;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f0f0f0;
            --tg-theme-section-header-text-color: #3390ec;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            transition: background-color 0.2s, color 0.2s;
        }

        /* Container for "Cards" or Sections */
        .theme-section {
            background-color: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-text-color);
            border-radius: 12px;
        }

        .theme-button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        .theme-link {
            color: var(--tg-theme-link-color);
        }

        .theme-hint {
            color: var(--tg-theme-hint-color);
        }

        .theme-border {
            border-color: var(--tg-theme-bg-color);
            /* Separator color */
        }

        /* Status Dots - Semantic colors need to be visible on both backgrounds. 
           We use standard safety colors but maybe add a white border for contrast if needed?
        */
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-idle {
            background-color: var(--tg-theme-hint-color);
        }

        .status-authenticating {
            background-color: #fbbf24;
        }

        .status-authenticated {
            background-color: #34d399;
        }

        .status-error {
            background-color: #f87171;
        }
    </style>
</head>

<body class="p-4 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center" style="color: var(--tg-theme-text-color)">DriveIt Bot</h1>

        <!-- Primary Status Indicator -->
        <div id="auth-status" class="mb-5 text-center font-medium p-4 theme-section shadow-sm">
            <span id="auth-status-dot" class="status-dot status-idle"></span>
            <span id="auth-status-text" class="text-sm">Initializing...</span>
        </div>

        <!-- User Information Table -->
        <div id="user-info" class="mb-6 hidden theme-section p-4 shadow-sm">
            <h3 class="text-xs font-bold uppercase mb-3 tracking-wide theme-hint">Telegram User</h3>
            <!-- Populated by JS -->
        </div>

        <!-- Drive Connection Status -->
        <div id="drive-section" class="mb-4 hidden">
            <h3 class="text-xs font-bold uppercase mb-3 tracking-wide ml-2 theme-hint">Google Drive</h3>

            <div class="theme-section p-6 shadow-sm text-center">

                <!-- Not Connected State -->
                <div id="drive-connect-ui" class="hidden">
                    <p class="text-sm mb-4">Link your Google Drive to enable file uploads.</p>
                    <a id="drive-link" href="#"
                        class="inline-block px-6 py-3 rounded-xl font-semibold shadow-sm transition opacity-90 hover:opacity-100 theme-button">
                        Connect Google Drive
                    </a>
                </div>

                <!-- Connected State -->
                <div id="drive-connected-ui" class="hidden">
                    <div class="flex items-center justify-center space-x-2 mb-2" style="color: #34d399">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span class="font-bold text-lg">Connected</span>
                    </div>
                    <p id="drive-email" class="text-center text-sm font-medium mb-6 opacity-80"></p>

                    <div class="p-3 rounded-lg text-sm text-center mb-6"
                        style="background-color: rgba(52, 211, 153, 0.1); color: #34d399;">
                        Send files to <a href="https://t.me/DriveItBot"
                            class="font-bold underline hover:opacity-80">@DriveItBot</a> to upload!
                    </div>

                    <button id="logout-button"
                        class="w-full text-center text-sm py-2 rounded transition theme-hint hover:opacity-80 underline">
                        Unlink Account
                    </button>
                </div>
            </div>
        </div>

        <div id="error" class="hidden mt-4 p-3 rounded-lg text-sm text-center"
            style="background-color: rgba(248, 113, 113, 0.1); color: #f87171;"></div>

        <div class="mt-8 text-center">
            <span class="text-xs theme-hint opacity-50">v1.0.1</span>
        </div>
    </div>

    <script>
        const CONFIG = {
            firebase: {
                apiKey: "AIzaSyAIY6BkbO6gRLMcLuOgtIBvwI4J1y2CHcw",
                authDomain: "aerial-episode-125308.firebaseapp.com",
                projectId: "aerial-episode-125308",
                appId: "1:224314386927:web:08bdead70144111af9ee1a"
            },
            auth: {
                backend: "https://driveit-v.deno.dev/authenticate",
                redirectUri: "https://betaturtle.github.io/driveit_v2/redir.html",
                clientId: "224314386927-kb90emu5vr086murg5ea0bmfod8tqlep.apps.googleusercontent.com"
            }
        };

        const UI = {
            statusDot: document.getElementById('auth-status-dot'),
            statusText: document.getElementById('auth-status-text'),
            userInfo: document.getElementById('user-info'),
            driveSection: document.getElementById('drive-section'),
            driveConnectBox: document.getElementById('drive-connect-ui'),
            driveConnectedBox: document.getElementById('drive-connected-ui'),
            driveEmail: document.getElementById('drive-email'),
            driveLink: document.getElementById('drive-link'),
            errorBox: document.getElementById('error'),

            updateStatus(state, text) {
                // state: 'idle', 'authenticating', 'authenticated', 'error'
                this.statusDot.className = `status-dot status-${state}`;
                this.statusText.textContent = text;
            },

            displayUser(user) {
                this.userInfo.innerHTML = '<h3 class="text-xs font-bold uppercase mb-3 tracking-wide theme-hint">Telegram User</h3>';
                const fields = [
                    // { label: 'Name', value: `${user.first_name} ${user.last_name || ''}` },
                    { label: 'ID', value: user.id },
                    { label: 'Username', value: user.username ? `@${user.username}` : 'N/A' },
                    // { label: 'Premium', value: user.is_premium ? 'Yes' : 'No' }
                ];

                fields.forEach((f, index) => {
                    const row = document.createElement('div');
                    row.className = `flex justify-between text-sm py-2 ${index < fields.length - 1 ? 'border-b theme-border' : ''}`;
                    row.innerHTML = `<span class="theme-hint">${f.label}</span><span class="font-medium">${f.value}</span>`;
                    this.userInfo.appendChild(row);
                });
                this.userInfo.classList.remove('hidden');
            },

            showDriveSection(connected, email = null) {
                this.driveSection.classList.remove('hidden');
                if (connected) {
                    this.driveConnectBox.classList.add('hidden');
                    this.driveConnectedBox.classList.remove('hidden');
                    this.driveEmail.textContent = email;
                    this.updateStatus('authenticated', 'Start Uploading!');
                } else {
                    this.driveConnectBox.classList.remove('hidden');
                    this.driveConnectedBox.classList.add('hidden');
                    this.driveLink.href = buildAuthUrl();
                    this.updateStatus('authenticated', 'Action Required');
                }
            },

            showError(msg) {
                this.updateStatus('error', 'Error');
                this.errorBox.textContent = msg;
                this.errorBox.classList.remove('hidden');
            }
        };

        function decodeBase64Url(str) {
            if (!str) return null;
            try {
                const base64 = str.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - str.length % 4) % 4);
                return new TextDecoder().decode(Uint8Array.from(atob(base64), c => c.charCodeAt(0)));
            } catch (e) {
                return null;
            }
        }

        function buildAuthUrl() {
            const params = new URLSearchParams({
                client_id: CONFIG.auth.clientId,
                redirect_uri: CONFIG.auth.redirectUri,
                response_type: 'code',
                scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
                include_granted_scopes: 'true',
                prompt: 'consent',
                access_type: 'offline',
                state: Math.random().toString(36).slice(2)
            });
            return `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
        }

        // Initialize Firebase globally
        const fbApp = firebase.initializeApp(CONFIG.firebase);
        const fbAuth = fbApp.auth();
        const fbDb = fbApp.firestore();

        async function authenticate(initData, googleCode) {
            UI.updateStatus('authenticating', 'Verifying...');

            // If we have a Google Code, we MUST authenticate via backend to exchange it
            if (googleCode) {
                return await performBackendAuth(initData, googleCode);
            }

            // Check for existing session
            const currentUser = await new Promise(resolve => {
                const unsubscribe = fbAuth.onAuthStateChanged(user => {
                    unsubscribe();
                    resolve(user);
                });
            });

            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;

            // Check if logged in and UIDs match
            if (currentUser && tgUser && currentUser.uid === String(tgUser.id)) {
                // Session matches, restore UI immediately
                console.log("Restoring session for", currentUser.uid);
                await loadUserDriveStatus(currentUser.uid);

                // Update last_login in background 
                updateLastLogin(currentUser.uid);
            } else {
                // No matching session, perform full backend auth
                await performBackendAuth(initData);
            }
        }

        async function performBackendAuth(initData, googleCode) {
            try {
                // Backend authentication
                const res = await fetch(CONFIG.auth.backend, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        initData,
                        googleAuth: googleCode ? { code: googleCode, redirect_uri: CONFIG.auth.redirectUri } : undefined
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || `Server error: ${res.status}`);
                if (!data.customToken) throw new Error('No auth token received');

                // Sign in with new token
                await fbAuth.signInWithCustomToken(data.customToken);
                const user = fbAuth.currentUser;

                // Save user data
                const userData = {
                    telegram_id: window.Telegram.WebApp.initDataUnsafe.user.id,
                    last_login: firebase.firestore.FieldValue.serverTimestamp(),
                    user: window.Telegram.WebApp.initDataUnsafe.user
                };

                if (data.google?.email) {
                    Object.assign(userData, {
                        google_email: data.google.email,
                        credentials: {
                            access_token: data.google.access_token,
                            refresh_token: data.google.refresh_token,
                            expires_in: data.google.expires_in,
                            obtained_at: Date.now()
                        }
                    });
                }

                await fbDb.collection('users').doc(user.uid).set(userData, { merge: true });

                // Update UI
                await loadUserDriveStatus(user.uid);

            } catch (err) {
                console.error(err);
                UI.showError(err.message);
            }
        }

        async function loadUserDriveStatus(uid) {
            try {
                const docRef = fbDb.collection('users').doc(uid);
                const snapshot = await docRef.get();
                const email = snapshot.data()?.google_email;
                UI.showDriveSection(!!email, email);
            } catch (err) {
                console.error("Failed to load user status:", err);
                UI.showError("Failed to load user status");
            }
        }

        async function updateLastLogin(uid) {
            try {
                await fbDb.collection('users').doc(uid).set({
                    last_login: firebase.firestore.FieldValue.serverTimestamp(),
                    user: window.Telegram.WebApp.initDataUnsafe.user
                }, { merge: true });
            } catch (e) {
                console.warn("Background last_login update failed:", e);
            }
        }

        async function logout() {
            if (!confirm('Are you sure you want to unlink your Google Drive?')) return;
            try {
                const fb = firebase.app();
                const user = fb.auth().currentUser;
                if (user) {
                    const docRef = fb.firestore().collection('users').doc(user.uid);
                    await docRef.update({
                        google_email: firebase.firestore.FieldValue.delete(),
                        credentials: firebase.firestore.FieldValue.delete()
                    });
                    await fb.auth().signOut();
                    window.location.reload();
                }
            } catch (err) {
                UI.showError('Logout failed: ' + err.message);
            }
        }

        // Main
        const tg = window.Telegram?.WebApp;
        if (!tg || !tg.initData || !tg.initDataUnsafe?.user) {
            UI.showError('This app must be opened from Telegram.');
            UI.updateStatus('error', 'Environment Error');
        } else {
            tg.ready();
            tg.expand();

            // Set header color for Android/iOS integration to match
            tg.setHeaderColor?.(tg.themeParams.secondary_bg_color || tg.themeParams.bg_color || '#ffffff');

            // Display User Info Immediately
            UI.displayUser(tg.initDataUnsafe.user);

            document.getElementById('logout-button').onclick = logout;
            UI.driveLink.onclick = (e) => {
                e.preventDefault();
                tg.openLink(buildAuthUrl());
            };

            const startParam = tg.initDataUnsafe.start_param;
            const googleCode = startParam ? decodeBase64Url(startParam) : null;

            authenticate(tg.initData, googleCode);
        }
    </script>
</body>

</html>
