<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveIt Bot</title>
    <!-- Preconnect to speed up backend connection -->
    <link rel="preconnect" href="https://driveit-v.deno.dev">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        :root {
            /* Fallback variables */
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #888888;
            --tg-theme-link-color: #3390ec;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f0f0f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            transition: background-color 0.2s, color 0.2s;
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Replaced Tailwind Utilities */
        .w-full {
            width: 100%;
        }

        .max-w-md {
            max-width: 28rem;
        }

        .text-center {
            text-align: center;
        }

        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .mb-2 {
            margin-bottom: 0.5rem;
        }

        .mb-3 {
            margin-bottom: 0.75rem;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .mb-5 {
            margin-bottom: 1.25rem;
        }

        .mb-6 {
            margin-bottom: 1.5rem;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .mt-8 {
            margin-top: 2rem;
        }

        .p-4 {
            padding: 1rem;
        }

        .p-6 {
            padding: 1.5rem;
        }

        .px-6 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        .py-2 {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .py-3 {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }

        .font-bold {
            font-weight: 700;
        }

        .font-medium {
            font-weight: 500;
        }

        .uppercase {
            text-transform: uppercase;
        }

        .tracking-wide {
            letter-spacing: 0.025em;
        }

        .text-2xl {
            font-size: 1.5rem;
            line-height: 2rem;
        }

        .text-lg {
            font-size: 1.125rem;
            line-height: 1.75rem;
        }

        .text-sm {
            font-size: 0.875rem;
            line-height: 1.25rem;
        }

        .text-xs {
            font-size: 0.75rem;
            line-height: 1rem;
        }

        .rounded-lg {
            border-radius: 0.5rem;
        }

        .rounded-xl {
            border-radius: 0.75rem;
        }

        .shadow-sm {
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .hidden {
            display: none;
        }

        .inline-block {
            display: inline-block;
        }

        .opacity-50 {
            opacity: 0.5;
        }

        .opacity-80 {
            opacity: 0.8;
        }

        .opacity-90 {
            opacity: 0.9;
        }

        .underline {
            text-decoration: underline;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        /* Custom Theme Classes */
        .theme-section {
            background-color: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-text-color);
            border-radius: 12px;
        }

        .theme-button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            text-decoration: none;
        }

        .theme-button:hover {
            opacity: 0.9;
        }

        .theme-link {
            color: var(--tg-theme-link-color);
        }

        .theme-hint {
            color: var(--tg-theme-hint-color);
        }

        .theme-border {
            border-color: rgba(0, 0, 0, 0.1);
            border-bottom-width: 1px;
            border-bottom-style: solid;
        }

        /* Status Dots */
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-idle {
            background-color: var(--tg-theme-hint-color);
        }

        .status-authenticating {
            background-color: #fbbf24;
        }

        .status-authenticated {
            background-color: #34d399;
        }

        .status-error {
            background-color: #f87171;
        }

        /* Icon */
        .icon-check {
            height: 2rem;
            width: 2rem;
        }
    </style>
</head>

<body>

    <div class="w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center" style="color: var(--tg-theme-text-color)">DriveIt Bot</h1>

        <!-- Primary Status Indicator -->
        <div id="auth-status" class="mb-5 text-center font-medium p-4 theme-section shadow-sm">
            <span id="auth-status-dot" class="status-dot status-idle"></span>
            <span id="auth-status-text" class="text-sm">Initializing...</span>
        </div>

        <!-- User Information Table -->
        <div id="user-info" class="mb-6 hidden theme-section p-4 shadow-sm">
            <h3 class="text-xs font-bold uppercase mb-3 tracking-wide theme-hint">Telegram User</h3>
            <!-- Populated by JS -->
        </div>

        <!-- Drive Connection Status -->
        <div id="drive-section" class="mb-4 hidden">
            <h3 class="text-xs font-bold uppercase mb-3 tracking-wide theme-hint" style="margin-left: 0.5rem;">Google
                Drive</h3>

            <div class="theme-section p-6 shadow-sm text-center">

                <!-- Not Connected State -->
                <div id="drive-connect-ui" class="hidden">
                    <p class="text-sm mb-4">Link your Google Drive to enable file uploads.</p>
                    <a id="drive-link" href="#"
                        class="inline-block px-6 py-3 rounded-xl font-semibold shadow-sm transition theme-button">
                        Connect Google Drive
                    </a>
                </div>

                <!-- Connected State -->
                <div id="drive-connected-ui" class="hidden">
                    <div class="flex items-center justify-center mb-2" style="color: #34d399; gap: 0.5rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon-check" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span class="font-bold text-lg">Connected</span>
                    </div>
                    <p id="drive-email" class="text-center text-sm font-medium mb-6 opacity-80"></p>

                    <div class="p-3 rounded-lg text-sm text-center mb-6"
                        style="background-color: rgba(52, 211, 153, 0.1); color: #34d399;">
                        Send files to <a href="#"
                            onclick="Telegram.WebApp.openTelegramLink('https://t.me/DriveItBot'); return false;"
                            class="font-bold underline hover:opacity-80">@DriveItBot</a> to upload!
                    </div>

                    <button id="logout-button"
                        class="w-full text-center text-sm py-2 rounded transition theme-hint hover:opacity-80 underline cursor-pointer"
                        style="background:none; border:none;">
                        Unlink Account
                    </button>
                </div>
            </div>
        </div>

        <div id="error" class="hidden mt-4 p-3 rounded-lg text-sm text-center"
            style="background-color: rgba(248, 113, 113, 0.1); color: #f87171;"></div>

        <div class="mt-8 text-center">
            <span class="text-xs theme-hint opacity-50">v1.1.6</span>
        </div>
    </div>

    <script>
        const CONFIG = {
            firebase: {
                apiKey: "AIzaSyAIY6BkbO6gRLMcLuOgtIBvwI4J1y2CHcw",
                authDomain: "aerial-episode-125308.firebaseapp.com",
                projectId: "aerial-episode-125308",
                appId: "1:224314386927:web:08bdead70144111af9ee1a"
            },
            auth: {
                backend: "https://driveit-v.deno.dev/authenticate",
                redirectUri: "https://betaturtle.github.io/driveit_v2/redir.html",
                clientId: "224314386927-kb90emu5vr086murg5ea0bmfod8tqlep.apps.googleusercontent.com"
            }
        };

        const UI = {
            statusDot: document.getElementById('auth-status-dot'),
            statusText: document.getElementById('auth-status-text'),
            userInfo: document.getElementById('user-info'),
            driveSection: document.getElementById('drive-section'),
            driveConnectBox: document.getElementById('drive-connect-ui'),
            driveConnectedBox: document.getElementById('drive-connected-ui'),
            driveEmail: document.getElementById('drive-email'),
            driveLink: document.getElementById('drive-link'),
            errorBox: document.getElementById('error'),

            updateStatus(state, text) {
                // state: 'idle', 'authenticating', 'authenticated', 'error'
                this.statusDot.className = `status-dot status-${state}`;
                this.statusText.textContent = text;
            },

            displayUser(user) {
                this.userInfo.innerHTML = '<h3 class="text-xs font-bold uppercase mb-3 tracking-wide theme-hint">Telegram User</h3>';
                const fields = [
                    { label: 'ID', value: user.id },
                    { label: 'Username', value: user.username ? `@${user.username}` : 'N/A' },
                ];

                fields.forEach((f, index) => {
                    const row = document.createElement('div');
                    row.className = `flex justify-between text-sm py-2 ${index < fields.length - 1 ? 'theme-border' : ''}`;
                    row.innerHTML = `<span class="theme-hint">${f.label}</span><span class="font-medium">${f.value}</span>`;
                    this.userInfo.appendChild(row);
                });
                this.userInfo.classList.remove('hidden');
            },

            showDriveSection(connected, email = null) {
                this.driveSection.classList.remove('hidden');
                if (connected) {
                    this.driveConnectBox.classList.add('hidden');
                    this.driveConnectedBox.classList.remove('hidden');
                    this.driveEmail.textContent = email;
                    this.updateStatus('authenticated', 'Start Uploading!');
                } else {
                    this.driveConnectBox.classList.remove('hidden');
                    this.driveConnectedBox.classList.add('hidden');
                    this.driveLink.href = buildAuthUrl();
                    this.updateStatus('authenticated', 'Action Required');
                }
            },

            showError(msg) {
                this.updateStatus('error', 'Error');
                this.errorBox.textContent = msg;
                this.errorBox.classList.remove('hidden');
            }
        };

        function decodeBase64Url(str) {
            if (!str) return null;
            try {
                const base64 = str.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - str.length % 4) % 4);
                return new TextDecoder().decode(Uint8Array.from(atob(base64), c => c.charCodeAt(0)));
            } catch (e) {
                return null;
            }
        }

        function buildAuthUrl() {
            const params = new URLSearchParams({
                client_id: CONFIG.auth.clientId,
                redirect_uri: CONFIG.auth.redirectUri,
                response_type: 'code',
                scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
                include_granted_scopes: 'true',
                prompt: 'consent',
                access_type: 'offline',
                state: Math.random().toString(36).slice(2)
            });
            return `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
        }

        // Initialize Firebase
        const fbApp = firebase.initializeApp(CONFIG.firebase);
        const fbAuth = fbApp.auth();
        const fbDb = fbApp.firestore();

        // Optimized Auth Flow
        async function authenticate(initData, googleCode) {
            UI.updateStatus('authenticating', 'Verifying...');

            // 1. Start Backend Request (Optimistic)
            const backendTask = performBackendRequest(initData, googleCode);

            // 2. Start Local Firebase Check
            // We wrap this in a promise that resolves with the user or null
            const firebaseTask = new Promise(resolve => {
                const unsubscribe = fbAuth.onAuthStateChanged(user => {
                    unsubscribe();
                    resolve(user);
                });
            });

            // 3. Race Conditions
            // We want to update the UI as soon as we have a CONFIRMED valid state.
            // A valid state is:
            //  - Local: User is logged in AND matches Telegram ID.
            //  - Network: Backend returns success AND has Google Email.

            let isUiUpdated = false;

            // Helper to handle completion of background sign-in
            const completeSignIn = async (data) => {
                if (!data.customToken) return;
                try {
                    await fbAuth.signInWithCustomToken(data.customToken);
                    const user = fbAuth.currentUser;

                    const userData = {
                        telegram_id: window.Telegram.WebApp.initDataUnsafe.user.id,
                        last_login: firebase.firestore.FieldValue.serverTimestamp(),
                        user: window.Telegram.WebApp.initDataUnsafe.user
                    };

                    if (data.google?.email) {
                        userData.google_email = data.google.email;
                        userData.credentials = {
                            access_token: data.google.access_token,
                            refresh_token: data.google.refresh_token,
                            expires_in: data.google.expires_in,
                            obtained_at: Date.now()
                        };
                    }

                    await fbDb.collection('users').doc(user.uid).set(userData, { merge: true });

                    // If UI wasn't updated by optimistic check (e.g. no google email returned in payload but present in db), update now
                    if (!isUiUpdated) {
                        isUiUpdated = true;
                        loadUserDriveStatus(user.uid);
                    }
                } catch (e) {
                    console.error("Background sign-in failed:", e);
                    if (!isUiUpdated) UI.showError("Auth Error: " + e.message);
                }
            };

            // Define handlers for the race
            const handleLocal = async (user) => {
                const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
                if (user && tgUser && user.uid === String(tgUser.id)) {
                    if (!isUiUpdated) {
                        console.log("Local session valid. Updating UI.");
                        isUiUpdated = true;
                        loadUserDriveStatus(user.uid);
                        updateLastLogin(user.uid);
                    }
                    return true; // Success
                }
                return false; // No valid local session
            };

            const handleNetwork = async (data) => {
                if (data.error) throw new Error(data.error);

                // If we have Google Email, we can show Connected immediately
                if (data.google?.email && !isUiUpdated) {
                    console.log("Backend returned email. Updating UI optimistic.");
                    isUiUpdated = true;
                    UI.showDriveSection(true, data.google.email);
                }

                // Always complete the sign-in/update in background/foreground
                await completeSignIn(data);
                return true;
            };

            // Execution Strategy:
            // If googleCode is present, we FORCE network wait because we need to exchange code.
            if (googleCode) {
                try {
                    const data = await backendTask;
                    await handleNetwork(data);
                } catch (e) {
                    UI.showError(e.message);
                }
                return;
            }

            // Otherwise, we race them.
            // We use a custom race logic:
            // Wait for both to settle unless one succeeds early.

            const localPromise = firebaseTask.then(handleLocal);
            const networkPromise = backendTask.then(handleNetwork).catch(e => {
                console.warn("Network auth failed:", e);
                return false;
            });

            // If local succeeds, we are done visually.
            // If network succeeds (and has email), we are done visually.

            // We wait for the "First Success" or "Both Done".
            const results = await Promise.allSettled([localPromise, networkPromise]);

            // If after both settled, UI is still not updated, it means:
            // 1. Local was null.
            // 2. Network didn't return google email (or failed).
            if (!isUiUpdated) {
                // If we are here, it means the user is likely NOT connected to Drive or NOT logged in.
                // But completeSignIn might have run.
                // If completeSignIn ran successfully (network success), it would have triggered `loadUserDriveStatus` if needed.
                // So if we are still here, we probably just need to show the "Connect" button.

                // Check if we are at least logged in now?
                const user = fbAuth.currentUser;
                if (user) {
                    loadUserDriveStatus(user.uid);
                } else {
                    // No session at all.
                    UI.showDriveSection(false);
                }
            }
        }

        async function performBackendRequest(initData, googleCode) {
            const authPayload = {
                initData,
                googleAuth: googleCode ? { code: googleCode, redirect_uri: CONFIG.auth.redirectUri } : undefined
            };

            const res = await fetch(CONFIG.auth.backend, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(authPayload)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `Server error: ${res.status}`);
            return data;
        }

        async function handleBackendResponse(data) {
            if (!data.customToken) throw new Error('No auth token received');

            // OPTIMIZATION: Optimistic UI Update
            // We have the Google info from the backend, so we can show "Connected" immediately.
            // We don't need to wait for the slow Firebase handshake to finish visually.
            if (data.google?.email) {
                UI.showDriveSection(true, data.google.email);
            }

            // Perform heavier operations in background
            (async () => {
                try {
                    // Sign in with new token (heavy operation)
                    await fbAuth.signInWithCustomToken(data.customToken);
                    const user = fbAuth.currentUser;

                    // Save user data
                    const userData = {
                        telegram_id: window.Telegram.WebApp.initDataUnsafe.user.id,
                        last_login: firebase.firestore.FieldValue.serverTimestamp(),
                        user: window.Telegram.WebApp.initDataUnsafe.user
                    };

                    if (data.google?.email) {
                        Object.assign(userData, {
                            google_email: data.google.email,
                            credentials: {
                                access_token: data.google.access_token,
                                refresh_token: data.google.refresh_token,
                                expires_in: data.google.expires_in,
                                obtained_at: Date.now()
                            }
                        });
                    }

                    await fbDb.collection('users').doc(user.uid).set(userData, { merge: true });

                    // Fallback UI update if we didn't have google email initially (unlikely in this flow)
                    if (!data.google?.email) {
                        await loadUserDriveStatus(user.uid);
                    }
                } catch (e) {
                    console.error("Background auth completion failed:", e);
                    // Only show error if UI isn't already happy
                    if (!data.google?.email) UI.showError("Auth failed: " + e.message);
                }
            })();
        }

        async function loadUserDriveStatus(uid) {
            try {
                const docRef = fbDb.collection('users').doc(uid);
                const snapshot = await docRef.get();
                const email = snapshot.data()?.google_email;
                UI.showDriveSection(!!email, email);
            } catch (err) {
                console.error("Failed to load user status:", err);
                UI.showError("Failed to load user status");
            }
        }

        async function updateLastLogin(uid) {
            try {
                // Fire and forget
                fbDb.collection('users').doc(uid).set({
                    last_login: firebase.firestore.FieldValue.serverTimestamp(),
                    user: window.Telegram.WebApp.initDataUnsafe.user
                }, { merge: true });
            } catch (e) {
                console.warn("Background last_login update failed:", e);
            }
        }

        async function logout() {
            if (!confirm('Are you sure you want to unlink your Google Drive?')) return;
            try {
                const fb = firebase.app();
                const user = fb.auth().currentUser;
                if (user) {
                    await fb.firestore().collection('users').doc(user.uid).update({
                        google_email: firebase.firestore.FieldValue.delete(),
                        credentials: firebase.firestore.FieldValue.delete()
                    });
                    await fb.auth().signOut();
                    window.location.reload();
                }
            } catch (err) {
                UI.showError('Logout failed: ' + err.message);
            }
        }

        // Main
        const tg = window.Telegram?.WebApp;
        if (!tg || !tg.initData || !tg.initDataUnsafe?.user) {
            // For testing in browser without Telegram
            // Mock if needed, or show error
            UI.showError('This app must be opened from Telegram.');
            document.body.style.backgroundColor = '#fff';
            document.body.style.color = '#000';
            UI.updateStatus('error', 'Environment Error');
        } else {
            tg.ready();
            tg.expand();

            tg.setHeaderColor?.(tg.themeParams.secondary_bg_color || tg.themeParams.bg_color || '#ffffff');
            UI.displayUser(tg.initDataUnsafe.user);

            document.getElementById('logout-button').onclick = logout;
            UI.driveLink.onclick = (e) => {
                e.preventDefault();
                tg.openLink(buildAuthUrl());
                tg.close();
            };

            const startParam = tg.initDataUnsafe.start_param;
            const googleCode = startParam ? decodeBase64Url(startParam) : null;

            authenticate(tg.initData, googleCode);
        }
    </script>
</body>

</html>
